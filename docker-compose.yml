name: ssi-prototype

networks:
  von_net:
    external: true
    name: ${VON_NETWORK_NAME}

services:
  issuer_government:
    image: ghcr.io/openwallet-foundation/acapy-agent:py3.13-1.6-lts
    user: "0:0"
    environment: ["RUST_LOG=warning"]
    ports: ["${GOVERNMENT_HTTP_PORT}:8031", "${GOVERNMENT_ADMIN_PORT}:8032"]
    volumes:
      - gov_wallet_data:/home/aries/.acapy_agent/wallet
      - ./genesis.txn:/home/aries/genesis.txn:ro
    networks: [von_net]
    entrypoint: ["aca-py", "start", "--inbound-transport", "http", "0.0.0.0", "8031", "--outbound-transport", "http", "--admin", "0.0.0.0", "8032", "--admin-insecure-mode", "--wallet-type", "askar-anoncreds", "--wallet-name", "government_wallet", "--wallet-key", "${GOVERNMENT_WALLET_KEY}", "--seed", "${GOVERNMENT_SEED}", "--genesis-file", "/home/aries/genesis.txn", "--endpoint", "http://issuer_government:8031", "--auto-provision"]

  issuer_employer:
    image: ghcr.io/openwallet-foundation/acapy-agent:py3.13-1.6-lts
    user: "0:0"
    environment: ["RUST_LOG=warning"]
    ports: ["${EMPLOYER_HTTP_PORT}:8021", "${EMPLOYER_ADMIN_PORT}:8022"]
    volumes:
      - emp_wallet_data:/home/aries/.acapy_agent/wallet
      - ./genesis.txn:/home/aries/genesis.txn:ro
    networks: [von_net]
    entrypoint: ["aca-py", "start", "--inbound-transport", "http", "0.0.0.0", "8021", "--outbound-transport", "http", "--admin", "0.0.0.0", "8022", "--admin-insecure-mode", "--wallet-type", "askar-anoncreds", "--wallet-name", "employer_wallet", "--wallet-key", "${EMPLOYER_WALLET_KEY}", "--seed", "${EMPLOYER_SEED}", "--genesis-file", "/home/aries/genesis.txn", "--endpoint", "http://issuer_employer:8021", "--auto-provision"]

  holder_tenant:
    image: ghcr.io/openwallet-foundation/acapy-agent:py3.13-1.6-lts
    user: "0:0"
    environment: ["RUST_LOG=warning"]
    ports: ["${TENANT_HTTP_PORT}:8041", "${TENANT_ADMIN_PORT}:8042"]
    volumes:
      - tenant_wallet_data:/home/aries/.acapy_agent/wallet
      - ./genesis.txn:/home/aries/genesis.txn:ro
    networks: [von_net]
    entrypoint: ["aca-py", "start", "--inbound-transport", "http", "0.0.0.0", "8041", "--outbound-transport", "http", "--admin", "0.0.0.0", "8042", "--admin-insecure-mode", "--wallet-type", "askar-anoncreds", "--wallet-name", "tenant_wallet", "--wallet-key", "${TENANT_WALLET_KEY}", "--seed", "${TENANT_SEED}", "--wallet-local-did", "--genesis-file", "/home/aries/genesis.txn", "--endpoint", "http://holder_tenant:8041", "--auto-provision"]

  verifier_landlord:
    image: ghcr.io/openwallet-foundation/acapy-agent:py3.13-1.6-lts
    user: "0:0"
    environment: ["RUST_LOG=warning"]
    ports: ["${LANDLORD_HTTP_PORT}:8051", "${LANDLORD_ADMIN_PORT}:8052"]
    volumes:
      - landlord_wallet_data:/home/aries/.acapy_agent/wallet
      - ./genesis.txn:/home/aries/genesis.txn:ro
    networks: [von_net]
    entrypoint: ["aca-py", "start", "--inbound-transport", "http", "0.0.0.0", "8051", "--outbound-transport", "http", "--admin", "0.0.0.0", "8052", "--admin-insecure-mode", "--wallet-type", "askar-anoncreds", "--wallet-name", "landlord_wallet", "--wallet-key", "${LANDLORD_WALLET_KEY}", "--seed", "${LANDLORD_SEED}", "--wallet-local-did", "--genesis-file", "/home/aries/genesis.txn", "--endpoint", "http://verifier_landlord:8051", "--auto-provision"]

volumes:
  gov_wallet_data:
  emp_wallet_data:
  tenant_wallet_data:
  landlord_wallet_data:
